[build]
  command = "pip install -r requirements.txt && python3 build.py && python3 scripts/generate-feeds.py"
  publish = "site"

[build.environment]
  PYTHON_VERSION = "3.11"

# Admin panel SPA redirect — serve index.html for all /admin/* paths
[[redirects]]
  from = "/admin/*"
  to = "/admin/index.html"
  status = 200

# Fallback 404 for anything not matched above
[[redirects]]
  from = "/*"
  to = "/404.html"
  status = 404

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=3600"

[[headers]]
  for = "/admin*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
